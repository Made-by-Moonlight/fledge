# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(slievr-cmd-terminal-cwd)" tmux new
$terminal = uwsm app -- $TERMINAL
$browser = slievr-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(slievr-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, slievr-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, slievr-launch-or-focus thunar thunar
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, YouTube Music, exec, ~/.local/bin/yt-music
bindd = SUPER SHIFT ALT, M, Music TUI, exec, slievr-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, slievr-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, slievr-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, slievr-launch-tui lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, slievr-launch-or-focus obsidian "uwsm-app -- obsidian"
bindd = SUPER SHIFT, slash, Passwords, exec, uwsm app -- 1password

#special workspace for games
bind = SUPER SHIFT, G, togglespecialworkspace, game

bindd = SUPER SHIFT, Y, YouTube, exec, slievr-launch-or-focus-webapp YouTube "https://youtube.com/"
# Overwrite existing bindings, like putting Slievr Menu on Super + Space
# unbind = SUPER SHIFT, SPACE
# bindd = SUPER SHIFT, SPACE, Slievr menu, exec, slievr-menu
#
#bindd = SUPER SHIFT ALT, L, movewindow, mon:0
# override old scrrenshot binds
unbind = , PRINT
unbind = SHIFT, PRINT
unbind = CTRL, PRINT
unbind = ALT, PRINT
unbind = CTRL ALT, PRINT
unbind = SUPER, PRINT

bindd = SHIFT CTRL, 4, Screenshot of region, exec, slievr capture screenshot region copy
