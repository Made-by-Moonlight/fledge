general {
    lock_cmd = slievr-system-lock                         # lock screen and 1password
    before_sleep_cmd = SLIEVR_LOCK_ONLY=true slievr-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && slievr-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}
