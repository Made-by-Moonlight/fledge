source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/theme/glow.png
    blur_passes = 2
}

animations {
    enabled = false
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $font_color
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 300
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.config/omarchy/current/theme/owl.png
    size = 260
    rounding = 0
    border_size = 0
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = m a d e   b y   m o o n l i g h t
    color = $font_color
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 64
    position = 0, -190
    halign = center
    valign = center

    inner_color = rgba(33, 42, 51, 1.0)
    outer_color = rgba(47, 54, 64, 1.0)
    outline_thickness = 2

    font_family = JetBrainsMono Nerd Font
    font_color = rgba(244, 175, 3, 1.0)
    placeholder_text =
    check_color = $check_color
    fail_color = rgba(229, 98, 106, 1.0)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    dots_center = true
    dots_size = 0.12
    dots_spacing = 0.5

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
