# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Vendored copies of Omarchy's default/hypr files (see hypr-defaults/README.md)
# — don't edit these directly, they're a read-only snapshot.
source = ~/.config/hypr/hypr-defaults/hypr/autostart.conf
source = ~/.config/hypr/hypr-defaults/hypr/bindings/media.conf
source = ~/.config/hypr/hypr-defaults/hypr/bindings/clipboard.conf
source = ~/.config/hypr/hypr-defaults/hypr/bindings/tiling-v2.conf
source = ~/.config/hypr/hypr-defaults/hypr/bindings/utilities.conf
source = ~/.config/hypr/hypr-defaults/hypr/envs.conf
source = ~/.config/hypr/hypr-defaults/hypr/looknfeel.conf
source = ~/.config/hypr/hypr-defaults/hypr/input.conf
source = ~/.config/hypr/hypr-defaults/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/windows.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# NVIDIA environment variables
env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = WLR_NO_HARDWARE_CURSORS,1

# Toggle config flags dynamically
source = ~/.local/state/hypr-toggles/*.conf
