# discord
windowrule = workspace 9, match:class discord
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class discord

# Spotify
windowrule = workspace 9, match:class spotify

# YouTube Music (opened via Zen's --new-window, see slievr-launch-webapp —
# no Chromium-style --app= class to match, so match by title instead;
# yt-music's own existing-window focus check already keys off this same
# title)
windowrule = workspace 9, match:title ^YouTube Music
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:title ^YouTube Music

#Zen
windowrule = no_blur on, match:class zen
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class zen

#Steam
# Force all Steam windows to tile and stay tiled
windowrule = tile on, match:class steam
windowrule = suppress_event float maximize activate, match:class steam
# Steam context menus have an empty title - exempt them so they float
windowrule = float on, match:class steam, match:title ^$

windowrule = opacity 1.0 override, match:class ^steam_app_\d+$
