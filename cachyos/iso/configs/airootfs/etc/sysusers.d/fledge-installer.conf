# The live installer user. releng's airootfs ships only passwd and shadow
# (no group/gshadow, and an overlay /etc/group would replace the package one),
# so systemd-sysusers creates fledge, and its group, at boot. Locked
# password: tty1 autologs in with agetty -f, nothing ever logs in with it.
u fledge 1000 "fledge installer" /home/fledge /usr/bin/bash
m fledge video
m fledge render
