# fledge live installer session. Hand-written on purpose: one
# client, no binds, nothing a user configures. Port it alongside the mbm
# settings generator when Hyprland 0.57 drops the .conf format.
monitor = , preferred, auto, auto

input {
    kb_layout = us
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 0
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0x171e28
    # Run straight from .bash_profile; a crashed session is restarted from tty1.
    disable_watchdog_warning = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# 0.56 always posts a 15 s ".conf format will be removed" notice, with no
# option to turn it off. It's posted right after exec-once spawns, so this
# hyprctl request is served after it and clears it.
exec-once = hyprctl dismissnotify
# The session ends when the installer does.
exec-once = qs -c mbm-installer; hyprctl dispatch exit
