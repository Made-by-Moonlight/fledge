$terminal = uwsm app -- $TERMINAL
bindd = SUPER, RETURN, Terminal, exec, $terminal --dir=x   # trailing comment
bindd = SUPER, W, Close window, killactive,
bind = SUPER SHIFT, G, togglespecialworkspace, game
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, vol +5
bindd = ALT, TAB, Focus on next window, cyclenext
bindd = ALT, TAB, Reveal active window on top, bringactivetotop
bindd = super, P, Pseudo window, pseudo, # dwindle
bindd = , PRINT, Screenshot, exec, shot
unbind = , PRINT
bindd = SUPER, C, Universal copy, sendshortcut, CTRL, Insert, activewindow
