# Generated by `mbm settings apply` from ~/.config/mbm/settings.json over the
# shipped defaults. Do not edit: change settings (or the defaults) instead.

bindd = SUPER, RETURN, Terminal, exec, uwsm app -- $TERMINAL
bindeld = , XF86AudioRaiseVolume, Volume up, exec, qs -c mbm ipc call osd volume +5
bindd = SUPER, SPACE, Launcher, exec, qs -c mbm ipc call launcher toggle
bindd = ALT, TAB, Focus on next window, cyclenext,
bindd = ALT, TAB, Focus on next window, bringactivetotop,
bindd = SUPER, code:10, Switch to workspace 1, workspace, 1

# Key recording in the settings window: an empty submap, so every key reaches
# the window. SUPER+CTRL+ALT+Escape always gets out (e.g. if the shell died).
submap = mbm-record
bind = SUPER CTRL ALT, Escape, submap, reset
submap = reset
