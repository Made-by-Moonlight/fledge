name: made by moonlight ISO

# test: every push / PR — unit tests + shellcheck, in Arch (ImageMagick 7 etc.)
# iso:  version tags (v*) build the installer ISO and publish a GitHub Release;
#       "Run workflow" builds it as a check without publishing (release assets
#       don't count against artifact storage, but a 1.7 GB workflow artifact
#       would blow the private-repo quota, so manual runs don't upload).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux/archlinux:latest
    steps:
      - name: Tools
        # qt6-declarative: qmltestrunner (and QtTest) for the shell's and installer's QML tests.
        # stow: check-stow-ignore.sh asks stow itself what it would link into ~.
        run: pacman -Syu --noconfirm --needed git bash diffutils python imagemagick librsvg shellcheck jq lua qt6-declarative stow

      - uses: actions/checkout@v4

      - name: Unit tests
        # safe.directory: test-check-stow-ignore.sh lists the repo with git ls-files.
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for t in cachyos/install/test-detect.sh cachyos/install/test-answers.sh cachyos/install/test-network.sh \
                   cachyos/install/test-progress.sh cachyos/install/test-desktop.sh cachyos/install/test-cachyos-repos.sh \
                   cachyos/iso/test-probe.sh cachyos/iso/test-live-hypr.sh cachyos/test-bootstrap.sh \
                   cachyos/iso/test-iso-lib.sh cachyos/branding/test-branding.sh cachyos/branding/test-theme.sh \
                   dot-local/share/fledge/test/test-settings.sh dot-local/share/fledge/test/test-defaults.sh \
                   dot-local/share/fledge/test/test-dmenu.sh dot-local/share/fledge/test/test-lua-syntax.sh \
                   dot-local/share/fledge/test/test-migrate.sh dot-local/share/fledge/test/test-dispatch.sh \
                   dot-local/share/fledge/test/test-fledge.sh dot-local/share/fledge/test/test-hypr-load.sh \
                   cachyos/iso/test-shell-qml.sh cachyos/iso/test-installer-qml.sh cachyos/test-check-names.sh \
                   cachyos/test-check-stow-ignore.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      - name: No legacy Hyprland IPC
        # Refused by Hyprland's Lua config, mostly with exit 0: nothing else would catch it.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash cachyos/check-legacy-ipc.sh

      - name: No old names
        # The names the fledge rename retired must not come back; the allowlist is in the script.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash cachyos/check-names.sh

      - name: Nothing but dotfiles stowed
        # .stow-local-ignore lists the project's top-level entries by name; a new one must be added there.
        run: bash cachyos/check-stow-ignore.sh

      - name: shellcheck
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mapfile -t files < <(git ls-files 'cachyos/*.sh' 'cachyos/iso/bin/*' \
            'cachyos/iso/configs/airootfs/usr/local/bin/*' \
            'cachyos/iso/configs/airootfs/home/fledge/.bash_profile' \
            'dot-local/share/fledge/bin/*' 'dot-local/share/fledge/**/*.sh')
          shellcheck -x -S warning "${files[@]}"

  iso:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free disk space
        # mkarchiso needs several GB on top of the docker image and pacman cache.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # fledge-iso-make clones the checkout; give it full history
          persist-credentials: false

      - name: Build ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A tag checks out as a detached HEAD, and the installed repo would then
          # have no upstream (no git pull). Releases come from main: build from a
          # local main at the tagged commit so the installed repo tracks origin/main.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main; tag a commit on main to release"
              exit 1
            fi
            git switch -C main
          fi
          # The repo is private: let fledge-iso-make's ls-remote see the branch.
          # Global config on the runner only — the ISO's clone doesn't copy it.
          git config --global http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          cachyos/iso/bin/fledge-iso-make

      - name: Verify
        id: iso
        run: |
          set -euo pipefail
          cd release
          sha256sum -c ./*.sha256
          iso="$(ls ./*.iso)"; iso="${iso#./}"
          size="$(stat -c %s "$iso")"
          echo "$iso: $((size / 1024 / 1024)) MiB"
          # GitHub release assets must be under 2 GiB.
          if (( size >= 2147483648 )); then
            echo "::error::$iso is $((size / 1024 / 1024)) MiB, over GitHub's 2 GiB release-asset limit"
            exit 1
          fi
          echo "name=$iso" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$iso.sha256")" >> "$GITHUB_OUTPUT"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ISO: ${{ steps.iso.outputs.name }}
          SHA: ${{ steps.iso.outputs.sha256 }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          The made by moonlight installer ISO, built from \`${TAG}\` (${GITHUB_SHA::7}).

          | File | SHA-256 |
          | --- | --- |
          | \`${ISO}\` | \`${SHA}\` |

          Check the download, then write it to a USB stick:

              sha256sum -c ${ISO}.sha256
              sudo dd if=${ISO} of=/dev/sdX bs=4M status=progress oflag=sync
          EOF
          gh release create "$TAG" "release/${ISO}" "release/${ISO}.sha256" \
            --title "made by moonlight ${TAG}" --notes-file notes.md --generate-notes --verify-tag
